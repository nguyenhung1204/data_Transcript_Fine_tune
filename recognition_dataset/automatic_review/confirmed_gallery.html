<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop đã xác nhận · Rà soát hóa đơn</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#172b4d;background:#f2f6fc;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#102342;color:white;padding:16px 24px;box-shadow:0 2px 8px #10234222}
    h1{font-size:22px;margin:0 0 6px}header p{margin:0;color:#c5d5ed;font-size:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px;background:#fff;border-bottom:1px solid #dbe4f1;align-items:center}
    input,select,button{font:inherit;border:1px solid #c8d6e8;border-radius:9px;background:#fff;color:#172b4d;padding:10px 12px}input{min-width:280px;flex:1}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
    #summary{padding:10px 24px;color:#536b8b;font-size:14px}.list{padding:0 24px 20px;display:grid;gap:12px}.row{background:white;border:1px solid #dbe4f1;border-radius:12px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);overflow:hidden;box-shadow:0 2px 5px #1023420a}
    .text{padding:16px;display:flex;flex-direction:column;justify-content:center;min-width:0}.label-title,.crop-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#637a99;margin-bottom:10px}.invoice-name{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:0 0 12px;color:#315a91}.invoice-name strong{font-size:13px;color:#536b8b}.invoice-name span{font-weight:650;overflow-wrap:anywhere}.invoice-name small{font-size:12px;color:#7b8da6}.transcript{font-size:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:#172b4d}.meta{font-size:13px;color:#657b99;margin-top:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.pill{border-radius:999px;background:#edf3fc;padding:3px 9px;color:#315a91}.proof{color:#12835e}.crop{border-left:1px solid #e1e8f2;background:#edf2f8;padding:12px;display:flex;flex-direction:column;min-width:0}.crop img{width:100%;height:170px;object-fit:contain;background:white;border:1px solid #dbe4f1;border-radius:7px}.crop a{color:inherit;text-decoration:none}.crop a:hover img{border-color:#2864d7}.crop-title{margin:0 0 8px}.pager{display:flex;gap:12px;align-items:center;justify-content:center;padding:4px 24px 28px;color:#536b8b}.pager button{font-weight:600}.empty{padding:40px;text-align:center;background:white;border-radius:12px;color:#657b99}.error{padding:24px;color:#a22;background:#fff1f0;margin:24px;border-radius:10px}
    @media(max-width:760px){header{padding:14px 16px}.toolbar{padding:12px 16px}#summary{padding:8px 16px}.list{padding:0 12px 16px}.row{grid-template-columns:1fr}.crop{border-left:0;border-top:1px solid #e1e8f2}.crop img{height:200px}.transcript{font-size:16px}}
  </style>
</head>
<body>
  <header>
    <h1>Đối chiếu transcript với ảnh crop đã xác nhận</h1>
    <p>Tên hóa đơn là gợi ý đọc từ tiêu đề OCR; hãy đối chiếu PDF. So transcript bên trái với đúng vùng ảnh bên phải.</p>
  </header>
  <section class="toolbar" aria-label="Bộ lọc">
    <input id="q" type="search" placeholder="Tìm mã hóa đơn, PDF hoặc transcript…" aria-label="Tìm kiếm">
    <select id="split" aria-label="Lọc tập">
      <option value="">Tất cả tập</option><option value="train">Train</option><option value="val">Validation</option><option value="test">Test</option>
    </select>
    <select id="method" aria-label="Lọc cách xác nhận">
      <option value="">Mọi cách xác nhận</option><option value="manual_visual_review">Đã rà thủ công</option><option value="pdf_ocr_agreement_v1">PDF + OCR đồng thuận</option><option value="other">Nhãn xác nhận khác</option>
    </select>
  </section>
  <div id="summary" role="status">Đang tải dữ liệu…</div>
  <main id="list" class="list" aria-live="polite"></main>
  <nav class="pager" aria-label="Phân trang">
    <button id="prev" type="button">← Trước</button><span id="page"></span><button id="next" type="button">Tiếp →</button>
  </nav>
  <script>
    const PAGE_SIZE=60;
    const EXCLUDED_INVOICES=new Set(['HD_028']);
    const $=s=>document.querySelector(s);
    let rows=[],pageIndex=0;
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const methodName=value=>value==='manual_visual_review'?'Đã rà thủ công':value==='pdf_ocr_agreement_v1'?'PDF + OCR đồng thuận':'Nhãn xác nhận khác';
    function invoiceTitleMap(data){const grouped=new Map();for(const r of data){if(!grouped.has(r.invoice))grouped.set(r.invoice,[]);grouped.get(r.invoice).push(r)}const titles=new Map(),fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/gu,'').replace(/[đĐ]/gu,'d').toLowerCase();for(const [invoice,items] of grouped){const candidates=items.map(r=>({text:String(r.text||r.ocr1||'').replace(/\s+/gu,' ').trim(),y:Number(r.coords?.[1])||0,confidence:Number(r.confidence)||0})).filter(c=>{const f=fold(c.text);return f.includes('hoa don')&&/(ban hang|gia tri gia tang|gtgt|sales invoice)/u.test(f)&&c.text.length<=100});candidates.sort((a,b)=>{const typeScore=t=>/(ban hang|gia tri gia tang|gtgt|sales invoice)/u.test(fold(t))?0:1;return typeScore(a.text)-typeScore(b.text)||a.y-b.y||b.confidence-a.confidence||a.text.length-b.text.length});titles.set(invoice,candidates[0]?.text||'Chưa nhận diện được')}return titles}
    function filtered(){const q=$('#q').value.trim().toLocaleLowerCase('vi'),split=$('#split').value,method=$('#method').value;return rows.filter(r=>(!split||r.split===split)&&(!method||(method==='other'?!['manual_visual_review','pdf_ocr_agreement_v1'].includes(r.method):r.method===method))&&(!q||`${r.invoice} ${r.pdf} ${r.transcript}`.toLocaleLowerCase('vi').includes(q)))}
    function render(){const found=filtered(),pages=Math.max(1,Math.ceil(found.length/PAGE_SIZE));pageIndex=Math.min(pageIndex,pages-1);const shown=found.slice(pageIndex*PAGE_SIZE,(pageIndex+1)*PAGE_SIZE);$('#summary').textContent=`${found.length.toLocaleString('vi-VN')} crop đã xác nhận · đang xem ${shown.length?`${(pageIndex*PAGE_SIZE+1).toLocaleString('vi-VN')}–${(pageIndex*PAGE_SIZE+shown.length).toLocaleString('vi-VN')}`:'0'} · Tổng đang xác nhận: ${rows.length.toLocaleString('vi-VN')}`;$('#page').textContent=`Trang ${pageIndex+1} / ${pages}`;$('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex>=pages-1;$('#list').innerHTML=shown.length?shown.map(r=>`<article class="row"><section class="text"><div class="invoice-name"><strong>Tên hóa đơn:</strong><span>${esc(r.invoiceTitle)}</span><small>gợi ý OCR</small></div><div class="label-title">Transcript nhìn thấy chính xác trên PDF</div><div class="transcript">${esc(r.transcript||'(nhãn trống)')}</div><div class="meta"><span class="pill">${esc(r.invoice)}</span><span class="pill">${esc(r.pdf)}</span><span class="pill">${esc(r.split==='val'?'Validation':r.split)}</span><span class="pill proof">${esc(methodName(r.method))}</span><span>ID ${esc(r.id)}</span></div></section><section class="crop"><div class="crop-title">Ảnh crop đã xác nhận</div><a href="${esc(r.image)}" target="_blank" rel="noopener"><img src="${esc(r.image)}" alt="Crop ${esc(r.invoice)}" loading="lazy"></a></section></article>`).join(''):'<div class="empty">Không có crop đã xác nhận khớp bộ lọc.</div>'}
    async function init(){try{const [d,p]=await Promise.all([fetch('/automatic_review/review_data.json',{cache:'no-store'}),fetch('/api/annotations',{cache:'no-store'})]);if(!d.ok||!p.ok)throw Error('Không đọc được dữ liệu từ máy chủ rà soát.');const data=await d.json(),saved=await p.json(),state={},titles=invoiceTitleMap(data);for(const r of data)if(['verified','rejected'].includes(r.status))state[r.id]={status:r.status,transcript:r.text,method:r.auto_status==='human_verified_preserved'?'other':null};for(const a of saved.annotations||[])state[a.crop_id]={...state[a.crop_id],...a,method:a.confirmation_method||state[a.crop_id]?.method};rows=data.filter(r=>state[r.id]?.status==='verified'&&!EXCLUDED_INVOICES.has(r.invoice)).map(r=>({id:r.id,invoice:r.invoice,pdf:r.pdf,split:r.split,transcript:state[r.id].transcript||r.text||'',method:state[r.id].method||'other',image:r.image,invoiceTitle:titles.get(r.invoice)||'Chưa nhận diện được'}));render()}catch(e){$('#summary').textContent='';$('#list').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
    $('#q').addEventListener('input',()=>{pageIndex=0;render()});$('#split').addEventListener('change',()=>{pageIndex=0;render()});$('#method').addEventListener('change',()=>{pageIndex=0;render()});$('#prev').onclick=()=>{pageIndex=Math.max(0,pageIndex-1);render();scrollTo({top:0,behavior:'smooth'})};$('#next').onclick=()=>{pageIndex++;render();scrollTo({top:0,behavior:'smooth'})};init();
  </script>
</body>
</html>
